# Configurações de build para projetos Vite
[build]
  command = "npm run build"
  publish = "dist"

# Regras para servir corretamente os exercícios
[[redirects]]
  from = "/exercises/*"
  to = "/exercises/:splat"
  status = 200
  force = true

[[headers]]
  for = "/exercises/*"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"

# Regra de redirecionamento geral para SPA (React)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
