# Configurações de build para projetos Vite.
[build]
  command = "npm run build"
  publish = "dist"

# Regra de redirecionamento para a pasta de exercícios.
# Esta regra específica deve vir ANTES da regra geral.
# Ela diz ao Netlify: "Se um arquivo for pedido de /exercises/, sirva-o diretamente."
[[redirects]]
  from = "/exercises/*"
  to = "/exercises/:splat"
  status = 200

# Regra de redirecionamento geral para aplicações de página única (SPA) como o React.
# Esta regra deve ser a ÚLTIMA.
# Ela diz: "Para qualquer outro caminho, sirva a página principal (index.html)."
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200